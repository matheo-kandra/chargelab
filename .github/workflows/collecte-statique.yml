name: Collecte statique

# Un telechargement par jour (docs/decisions.md, ADR 10). Archivage compact :
# photo complete le lundi, diff de contenu et journal date_maj les autres jours.
# Le script verifie que la reconstruction du jour redonne exactement le fichier
# telecharge ; sinon il echoue.
on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot (sans l'archive dynamique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            collect
            data/collecte/journal
            data/collecte/statique
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collect/requirements.txt

      - run: pip install -r collect/requirements.txt

      - name: Telecharger, archiver, verifier la reconstruction
        run: python collect/collecte_statique.py

      - name: Publier l'archive
        if: always()
        run: bash collect/publier.sh "collecte statique"
