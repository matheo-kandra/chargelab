name: Collecte

# Cadence garantie, indépendante du planificateur de GitHub.
#
# Le cron '*/5' a ete essaye et mesure : un seul declenchement obtenu en quatre
# heures la ou cinquante etaient attendus (docs/decisions.md, ADR 09). GitHub
# abandonne les passages planifies en periode de charge, et les frequences
# courtes sont les premieres sacrifiees.
#
# On declenche donc une fois par heure une boucle qui tient elle-meme la cadence
# de l'ADR 08 jusqu'au creneau horaire suivant : 5 minutes de 06:00 a 20:00 UTC,
# 15 minutes sinon. Un declenchement horaire retarde de vingt minutes coute
# vingt minutes de collecte, pas la journee. Le depot etant public, les minutes
# de calcul sont illimitees.
#
# La collecte statique quotidienne est faite par la meme boucle, au premier
# passage suivant 03:00 UTC.
on:
  schedule:
    - cron: '4 * * * *'
  workflow_dispatch:

concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collect/requirements.txt

      - run: pip install -r collect/requirements.txt

      - name: Verifier la sante des collecteurs
        run: python collect/verifier.py

      - name: Collecter jusqu'au creneau horaire suivant
        run: |
          fin=$(python -c "
          from datetime import datetime, timedelta, timezone
          t = datetime.now(timezone.utc).replace(minute=4, second=0, microsecond=0) + timedelta(hours=1)
          print(t.isoformat())
          ")
          echo "collecte jusqu'a ${fin}"
          python collect/boucle_locale.py --jusqu-a "${fin}"
