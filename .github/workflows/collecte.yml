name: Collecte

# Cadence garantie, indépendante du planificateur de GitHub.
#
# Le cron '*/5' a ete essaye et mesure : un seul declenchement obtenu en quatre
# heures la ou cinquante etaient attendus (docs/decisions.md, ADR 09). GitHub
# abandonne les passages planifies en periode de charge, et les frequences
# courtes sont les premieres sacrifiees.
#
# On declenche donc une boucle qui tient elle-meme la cadence de l'ADR 08 :
# 5 minutes de 06:00 a 20:00 UTC, 15 minutes sinon.
#
# La boucle s'arrete a la prochaine borne de six heures, 00:04, 06:04, 12:04
# ou 18:04 UTC, soit la duree maximale d'un job.
#
# Le cron horaire a ete essaye et mesure du 20 au 21/09 : deux declenchements
# obtenus sur dix-sept attendus, et 383 minutes de trou sur 1 045 minutes de
# fenetre. Quand la boucle tourne elle tient la cadence, avec seulement trois
# ecarts de plus de vingt minutes sur soixante-deux passages ; le probleme est
# qu'il faut qu'un cron aboutisse au bon moment pour qu'une boucle demarre.
#
# On declenche donc toutes les cinq minutes. Le groupe de concurrence
# n'autorise qu'une boucle a la fois : les declenchements suivants forment une
# file d'un seul element, sans consommer de minutes tant qu'ils attendent, et
# le premier en attente demarre des que la boucle en cours atteint sa borne.
# Il suffit qu'UN declenchement sur les soixante-douze d'une fenetre de six
# heures aboutisse pour que la releve soit assuree.
#
# Le depot etant public, les minutes de calcul sont illimitees.
#
# La collecte statique quotidienne est faite par la meme boucle, au premier
# passage suivant 03:00 UTC.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collect/requirements.txt

      - run: pip install -r collect/requirements.txt

      - name: Verifier la sante des collecteurs
        run: python collect/verifier.py

      - name: Collecter jusqu'a la prochaine borne de six heures
        run: |
          fin=$(python -c "
          from datetime import datetime, timedelta, timezone
          maintenant = datetime.now(timezone.utc)
          for h in (0, 6, 12, 18):
              borne = maintenant.replace(hour=h, minute=4, second=0, microsecond=0)
              if borne > maintenant:
                  break
          else:
              borne = (maintenant + timedelta(days=1)).replace(hour=0, minute=4, second=0, microsecond=0)
          print(borne.isoformat())
          ")
          echo "collecte jusqu'a ${fin}"
          python collect/boucle_locale.py --jusqu-a "${fin}"
