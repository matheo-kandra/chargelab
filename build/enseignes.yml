# Nom affiche de chaque prefixe eMI3, decide a la main (ADR 07).
#
# Par defaut, le nom d'un prefixe est son libelle `nom_operateur` majoritaire,
# debarrasse du marqueur d'itinerance (« Freshmile | FR*FR1 » devient
# « Freshmile »). Ce fichier ne corrige que les cas ou ce defaut est faux.
#
# Pourquoi il ne pouvait pas rester vide
# --------------------------------------
# La verification prefixe par prefixe a montre que `nom_operateur` designe
# souvent l'exploitant technique et non le reseau que voit l'automobiliste.
# Deux exploitants a eux seuls faussent le classement :
#
#   IZIVIA exploite pour Q-Park, le SIGEIF, IKEA et la metropole de Nice.
#   Sans correction, ces quatre reseaux disparaissent dans un « IZIVIA » de
#   5 000 points de charge qui n'existe sous ce nom nulle part.
#
#   Bouygues Energies & Services exploite pour cinq collectivites, dont
#   Pass pass electrique, Alize Liberte 2 et La borne bleue. Meme effet.
#
# Regle que je me suis imposee : la valeur retenue doit figurer telle quelle
# dans les donnees du prefixe, comme `nom_enseigne`, `nom_operateur` ou
# `nom_amenageur`. Les seules retouches autorisees sont le retrait du marqueur
# de role « CPO » et de la forme juridique. Chaque ligne porte la part du
# libelle qui la justifie, mesuree sur l'edition du 19 septembre 2026.
#
# Les regroupements de plusieurs prefixes sous un meme nom ne sont faits que
# quand la marque est la meme dans l'operateur ET dans l'enseigne. Un reseau
# tiers exploite par une marque n'est pas regroupe avec elle : Belib' reste
# Belib' meme si TotalEnergies l'exploite.

# --- reseaux exploites par IZIVIA -----------------------------------------
QPARK:
  - FRQPK          # enseigne QPARK : 100 % des 1 934 points
SIGEIF:
  - FRSIG          # enseigne SIGEIF : 88 % des 1 269 points
IKEA:
  - FRIKA          # enseigne IKEA : 100 % des 915 points
NICE RP:
  - FRM06          # enseigne NICE RP : 98 % des 870 points

